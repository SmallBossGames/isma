[versions]
kotlinx-coroutines = "1.11.0"
kotlin-plugin = "2.4.0"
kotlinx-serialization-json = "1.11.0"
javafx-plugin = "0.1.0"
javafx-libs = "27-ea+21"
org-apache-poi = "5.5.1"
ikonli = "12.4.0"
grpc = "1.82.0"
ktor = "3.5.0"
netty = "4.2.15.Final"
google-protobuf-plugin = "0.10.0"
ben-manes-versions = "0.54.0"

[libraries]
antlr4-runtime = { module = "org.antlr:antlr4-runtime", version = "4.13.2" }
com-google-guava = { module = "com.google.guava:guava", version = "33.6.0-jre" }
controlsfx = "org.controlsfx:controlsfx:11.2.3"
de-sciss-jwave = { module = "de.sciss:jwave", version = "1.0.3" }
fxmisc-richtext-core = { module = "org.fxmisc.richtext:richtextfx", version = "0.11.7" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-material2-pack = { module = "org.kordamp.ikonli:ikonli-material2-pack", version.ref = "ikonli" }
jamm = "com.github.jbellis:jamm:0.4.0"
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
junit = { module = "junit:junit", version = "4.13.2" }
junit-dataprovider = "com.tngtech.java:junit-dataprovider:1.13.1"
kfixture = "ru.kontur.kinfra.kfixture:kfixture:0.6.0"
koin-core = { module = "io.insert-koin:koin-core", version = "4.2.2" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin-plugin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-javafx = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-javafx", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.34" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version = "6.3.0" }
mockk = { module = "io.mockk:mockk", version = "1.14.4" }
org-apache-commons-lang = "org.apache.commons:commons-lang3:3.20.0"
org-apache-poi = { module = "org.apache.poi:poi", version.ref = "org-apache-poi" }
org-apache-poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "org-apache-poi" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }


netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-transport-classes-epoll = { module = "io.netty:netty-transport-classes-epoll", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version = "4.35.1" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.0" }

junit-jupiter-api = "org.junit.jupiter:junit-jupiter-api:6.1.0"
junit-jupiter-engine = "org.junit.jupiter:junit-jupiter-engine:6.1.0"

[plugins]
java-modules = { id = "org.javamodularity.moduleplugin", version = "2.0.1" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-plugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-plugin" }
google-protobuf = { id = "com.google.protobuf", version.ref = "google-protobuf-plugin" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
