syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

enum TokenKind {
  TOKEN_KIND_UNSPECIFIED = 0;
  KEYWORD = 1;
  COMMENT = 2;
  NUMBER = 3;
  TEXT = 4;
}

message SyntaxToken {
  int32 start = 1;
  int32 length = 2;
  TokenKind kind = 3;
}

message HighlightResponse {
  repeated SyntaxToken tokens = 1;
}
