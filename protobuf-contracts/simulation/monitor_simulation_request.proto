syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

/* 
 * Request to monitor simulation progress.
 */
message MonitorSimulationRequest {
  // ID returned from RunSimulation
  int64 simulation_id = 1;
  // Accuracy threshold in [0.0, 1.0] — report progress when time advances by
  // this fraction of total simulation range. Last value always reported.
  double accuracy = 2;
}
