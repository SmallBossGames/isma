syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

/*
 * Configuration for adaptive step size control.
 * When this message is present in RunSimulationRequest, adaptive step control is enabled.
 */
message AccuracyConfig {
  // Target accuracy for adaptive methods
  double accuracy = 1;
}

/*
 * Configuration for stability control during simulation.
 * When this message is present in RunSimulationRequest, stability control is enabled.
 */
message StabilityConfig {
}

/*
 * Configuration for event detection during simulation.
 * When this message is present in RunSimulationRequest, event detection is enabled.
 */
message EventDetectionConfig {
  // Gamma parameter for event detection (controls step size near events)
  double gamma = 1;
  // Low bound for step size when event detection is active
  double low_border = 2;
}

/*
 * Request to start a new simulation.
 */
message RunSimulationRequest {
  // Simulation start time
  double start_time = 1;
  // Simulation end time
  double end_time = 2;
  // Initial integration step size
  double initial_step = 3;
  // Integration method name (e.g., "Euler", "RK4")
  string method_name = 4;
  // Accuracy configuration for adaptive step size control
  AccuracyConfig accuracy_config = 5;
  // Stability configuration for stability control
  StabilityConfig stability_config = 6;
  // Event detection configuration
  EventDetectionConfig event_detection = 8;
  // Compiled model ID (required) - obtained from LismaCompilerService.Compile
  string compiled_model_id = 9;
}
