syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

/* 
 * Request to start a new simulation.
 */
message RunSimulationRequest {
  // Simulation start time
  double start_time = 1;
  // Simulation end time
  double end_time = 2;
  // Initial integration step size
  double initial_step = 3;
  // Integration method name (e.g., "Euler", "RK4")
  string method_name = 4;
  // Target accuracy for adaptive methods
  double accuracy = 5;
  // Enable adaptive step size control
  bool is_accuracy_in_use = 6;
  // LISMA source code for the model (required)
  string lisma_source_code = 7;
}
