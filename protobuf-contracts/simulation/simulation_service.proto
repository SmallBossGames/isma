syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

import "simulation/cancel_simulation_request.proto";
import "simulation/cancel_simulation_response.proto";
import "simulation/get_simulation_result_request.proto";
import "simulation/get_simulation_result_response.proto";
import "simulation/list_simulation_methods_request.proto";
import "simulation/list_simulation_methods_response.proto";
import "simulation/monitor_simulation_request.proto";
import "simulation/monitor_simulation_response.proto";
import "simulation/run_simulation_request.proto";
import "simulation/run_simulation_response.proto";

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

/* 
 * ISMA Simulation Service
 *
 * Provides RPCs for running numerical simulations, retrieving results,
 * monitoring progress, and listing available integration methods.
 */
service SimulationService {
  // Starts a simulation, returns simulation ID
  rpc RunSimulation(RunSimulationRequest) returns (RunSimulationResponse);
  // Retrieves completed simulation results
  rpc GetSimulationResult(GetSimulationResultRequest) returns (GetSimulationResultResponse);
  // Streams progress updates for a running simulation
  rpc MonitorSimulation(MonitorSimulationRequest) returns (stream MonitorSimulationResponse);
  // Lists available integration methods
  rpc ListSimulationMethods(ListSimulationMethodsRequest) returns (ListSimulationMethodsResponse);
  // Cancels a running simulation
  rpc CancelSimulation(CancelSimulationRequest) returns (CancelSimulationResponse);
}
